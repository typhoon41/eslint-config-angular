# Builds every push and PR; publishes to npmjs.org when a merge to main bumps the version in package.json,
# after approval in the 'package-release' environment (toolkit release/docs/ADOPTING.md).

trigger:
  branches:
    include: [ main ]

pr:
  branches:
    include: [ main ]

resources:
  repositories:
    - repository: toolkit
      type: github
      name: typhoon41/toolkit
      endpoint: typhoon41

stages:
  - template: release/templates/stages/package-release.yml@toolkit
    parameters:
      npmServiceConnection: 'NPM - typhoon41'
      npmAccess: public                  # scoped @typhoon41 package on npmjs.org
      nodeVersion: 22.x
      buildSteps:
        - pwsh: npm ci
          displayName: Install packages
        - pwsh: >-
            node --input-type=module -e "import { ESLint } from 'eslint'; import config from './index.js';
            await new ESLint({ overrideConfigFile: true, overrideConfig: config }).calculateConfigForFile('src/index.ts');"
          displayName: Validate configuration
